[project]
name = "transcript-api"
version = "0.1.0"
description = "Local OpenAPI transcription and review service for Abugida Media Kit"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
