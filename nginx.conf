events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        text/vtt vtt;
        application/json json;
        application/ld+json jsonld;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression for low-bandwidth 3G
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/vtt;
        gzip_min_length 256;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static media assets
        location ~* \.(mp4|opus|mp3|vtt|pdf|webp|png|jpg)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
