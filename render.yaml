services:
  - type: web
    name: abugida-transcript-api
    runtime: python
    rootDir: services/transcript-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ASR_ADAPTER
        value: local-fallback
    healthCheckPath: /health
    autoDeploy: true
