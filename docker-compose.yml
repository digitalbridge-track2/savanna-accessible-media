services:
  # Host Platform & Module Static Server (Hackathon Guide Section 10 Specification)
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./savanna:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Interactive Hackathon Demo & Verification Application (React + Vite PWA)
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Level 2: Local FastAPI Transcription & OpenAPI Service (/docs, /api/v1/...)
  api:
    build:
      context: .
      dockerfile: services/transcript-api/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
